[package]
name = "ribossome"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
wgpu = "30"
winit = "0.30"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
glam = { version = "0.30", features = ["bytemuck"] }
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
