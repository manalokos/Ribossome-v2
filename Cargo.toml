[package]
name = "ribossome"
version = "0.4.0"
edition = "2024"
default-run = "ribossome"
rust-version = "1.99"

[dependencies]
wgpu = "30"
winit = "0.30"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
glam = { version = "0.30", features = ["bytemuck"] }
log = "0.4"
env_logger = "0.11"
png = "0.17"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
lz4_flex = "0.14.0"
egui_plot = "0.37"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
winresource = "0.1"
